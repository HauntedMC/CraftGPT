version: 2
# Platform-owned Maven versions are updated by HauntedPlatform's reviewed reconciler.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    groups:
      routine-action-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "ci"]
